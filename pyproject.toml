[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "overleaf-mcp"
version = "0.1.0"
description = "Python MCP server for Overleaf with a local Puppeteer browser"
requires-python = ">=3.12,<3.15"
dependencies = ["mcp>=1.26,<2"]

[project.scripts]
overleaf-mcp = "cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
exclude = ["node_modules", "__pycache__"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
